name: Fork Release

run-name: Vail ${{ github.event_name == 'push' && github.ref_name || 'release rehearsal' }}

on:
  push:
    # Starts with 'f' so upstream release.yml's v* trigger cannot also fire.
    tags: ['fork-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'rwjblue/QK4'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve fork version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$GITHUB_REF_NAME" =~ ^fork-v[0-9][A-Za-z0-9._-]*$ ]] || exit 1
            VERSION="${GITHUB_REF_NAME#fork-v}-vail"
          else
            VERSION="vail-rehearsal-${GITHUB_SHA:0:7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/fork-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.macos-artifact }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.flatpak-artifact }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.windows-artifact }}
          path: QK4-windows
      - name: Create Windows portable archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: zip -qr "QK4-${VERSION}-windows-x86_64.zip" QK4-windows
      - name: Prepare checksums and release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "QK4-${VERSION}-macos.dmg" "QK4-${VERSION}-linux-x86_64.flatpak" \
            "QK4-${VERSION}-windows-x86_64.zip" > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<'NOTES'
          Unofficial QK4 fork with Vail adapter support, updated to upstream development at [72025dfe](https://github.com/mikeg-dal/QK4/commit/72025dfeea15fb31759c8dd03a6146912a6ca648). This is a prerelease for hardware testing.

          Vail still generates its own iambic elements and immediate buzzer sidetone. Optional computer sidetone now uses upstream's paced audio output and device format conversion while preserving Vail's timestamped MIDI edges. MIDI and audio-device latency still apply. Upstream's new HaliKey paddle modes, straight-key input, and settings remain available when HaliKey is selected.

          **CW Keyer -> Remote Keying -> Key-Down Delay** shows the K4's saved remote delay (0-1000 ms; default 80 ms). Raise it for a slow or busy link, or lower it for a quicker start on a fast LAN. Connecting Vail keeps the radio's setting. This does not delay the adapter buzzer. **Escape** aborts Vail sending; release the paddles before resuming.

          The adapter buzzer remains the default. Selecting computer audio does not mute it: stock Vail firmware requires a manual paddle gesture with the Vail connection disconnected in QK4. The settings panel and setup guide explain the steps. Pitch follows the K4's CW Pitch setting. No adapter firmware update is required.

          - macOS: Apple Silicon, macOS 15 or newer. The app is ad-hoc signed without Apple notarization.
          - Windows: Windows 11 x64 portable ZIP. Extract the complete QK4-windows folder and run QK4.exe. Qt, audio/USB libraries, and the Microsoft runtime are included. The app is unsigned, so Windows may show SmartScreen.
          - Linux: x86_64 Flatpak, using the KDE 6.10 runtime.
          - SHA256SUMS.txt covers all three packages.

          The upstream threaded-keyer inhibit test now waits for an in-flight element's matching key-up while still rejecting new key-downs. This removes a CI timing race without changing runtime keyer behavior.

          Validation: all 58 local CTest suites passed. Publication requires the tagged Linux normal and ASAN/UBSAN test runs, 12 focused CW/Vail suites on macOS and Windows, and all three package checks to pass. The packaged macOS and Windows apps are also launched with --version in CI.

          Earlier builds were tested with a physical Vail and K4 through 28 WPM, including key-up/disconnect and both buzzer and computer sidetone. This upstream integration needs fresh on-radio regression checks; physical Vail operation on Windows remains unverified. Previous release tags and assets are unchanged.

          NOTES
          printf '\nBuilt from %s.\n\nSetup, limitations, and maintenance: %s/%s/blob/%s/docs/vail-fork.md\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> RELEASE_NOTES.md
          {
            echo "Built from ${GITHUB_SHA}."
            echo
            cat RELEASE_NOTES.md
            echo
            cat SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save assembled release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vail-release-${{ needs.version.outputs.version }}
          path: |
            QK4-*.dmg
            QK4-*.flatpak
            QK4-*.zip
            SHA256SUMS.txt
            RELEASE_NOTES.md
          retention-days: 14
      - name: Publish fork prerelease
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fork-v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: QK4 ${{ needs.version.outputs.version }} (hardware testing)
          prerelease: true
          make_latest: false
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            QK4-${{ needs.version.outputs.version }}-macos.dmg
            QK4-${{ needs.version.outputs.version }}-linux-x86_64.flatpak
            QK4-${{ needs.version.outputs.version }}-windows-x86_64.zip
            SHA256SUMS.txt
